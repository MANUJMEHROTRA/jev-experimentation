[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-experimentation"
version = "0.2.0"
description = "Build System 1 typed decision models (Jev/Laya style) from pretrained encoders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "transformers>=4.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebook = ["datasets>=3.0", "jupyter", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]